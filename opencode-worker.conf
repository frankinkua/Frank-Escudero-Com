# opencode-worker configuration
# -------------------------------
# This file is shell-sourceable, read by /web/opencode-worker.sh on every run,
# so edits apply immediately - no service restart needed.
# Values are KEY="value" lines; '#' starts a comment.
#
# The worker is a SINGLE-SHOT runner: it starts one `opencode run`, waits for
# it to finish (or for TIMEOUT_MINUTES, whichever comes first), verifies the
# site, commits, prints a RESULT=... line to stdout, and exits. Scheduling the
# repeats is the caller's job (cron, a wrapper, or the terminal), NOT the
# script's. There is NO loop and NO internal sleep.

# Master switch: 1 = allow a run, 0 = refuse and exit immediately.
ENABLED="1"

# The task handed to every session. Change this to redirect what the agent
# does. A manually-passed first argument to opencode-worker.sh overrides this.
# Content-only mode: the agent may ONLY edit markdown text (site docs +
# knowledge files). It must NEVER touch code or anything that changes
# functionality. A post-run guard in opencode-worker.sh enforces this too.
PROMPT="You are the CONTENT EDITOR for a Reflex CV website. STRICT RULE: NEVER touch code. You must not modify main.py, site_store.py, rxconfig.py, any .js/.jsx/.css file, any shell or init script, any config or JSON or opencode file, the venv, or anything under .web/. You may ONLY edit markdown text: the site page docs (/web/about.md, /web/about-fun.md, /web/contact.md, /web/cv.md, /web/projects.md, /web/resources.md, /web/stack.md, /web/deploy.md, /web/timeline.md, /web/contribute.md) and the knowledge files (/web/knowledge.md, /web/prompt.md). TASK: learn from the last chats and the version footer. Read /web/data/conversations.json, focus on the most recent conversations, and see what visitors ask and where the site text is thin, missing, or outdated. Also read the version footer (v0.1.0 plus git SHA, rendered by app_version()) to stay consistent with the current release. Then update knowledge.md and the relevant site docs with small, factual text improvements that answer those visitor questions better. Do not invent features, change behavior, or alter functionality in any way. When finished, write a short summary of what you learned and which text files you changed."

# RESERVED for callers that schedule repeats; the script itself ignores it.
# Keep 60 so remote/scheduled invocations back off between runs.
INTERVAL_MINUTES="60"

# Model id in opencode's provider/model format. prism-ml/bonsai-27b (a
# reasoning model) runs behind the olla proxy on gx10-23ef (100.100.1.10).
# opencode reaches it over the OpenAI-compatible endpoint. The worker script
# registers the model with opencode automatically on every run (it must match
# the id the proxy reports in /v1/models). No auth token.
MODEL="openai/prism-ml/bonsai-27b"

# olla proxy API base URL (OpenAI-compatible). opencode injects it (plus /v1
# and the model registration) on every run.
URL="http://100.100.1.10:40114/olla/proxy"

# Hard kill for one run, in minutes. bonsai-27b reasoning on the amd-64gb
# box can be slow; the script kills opencode at this cap and exits
# RESULT=timeout (code 2).
TIMEOUT_MINUTES="30"

# UNUSED by the single-shot worker (a retained knob from the old loop). Keep
# 0 = no cap.
MAX_RUNS="0"

# 1 = pass --yolo to opencode (auto-approves EVERY action, no auth prompts,
# fully autonomous/headless). The agent can then edit/restart things without a
# human. Risk is on you. 0 = normal prompting (a non-TTY run would stall).
YOLO_MODE="1"

# Local URL used to health-check the site after each run. If the request
# fails, the worker rolls the repo back to the last good commit and restarts
# the website service. Empty = skip verification (not recommended).
VERIFY_URL="http://127.0.0.1:8000"

# 1 = commit each run's changes to git in /web (keeps rollback history).
# 0 = let the agent's edits sit uncommitted.
GIT_COMMIT="1"

# 1 = after each run, revert EVERY file change that is not markdown (.md).
# Defense-in-depth: even with YOLO_MODE=1, code/config cannot be shipped or
# committed by the worker. 0 = let the agent's changes stand as-is.
TEXT_ONLY_GUARD="1"

# Where the worker's own output is logged (opencode's per-run stdout/stderr
# is appended to the same file).
LOG_FILE="/var/log/opencode-worker.log"

# --- exit-code contract (for callers that self-check) -----------------------
#   echo prints RESULT=... before exiting:
#   exit 0 = success                RESULT=ok / ok-noverify (verified)
#   exit 1 = model error / failed   RESULT=error
#   exit 2 = TIMEOUT                RESULT=timeout  (killed at TIMEOUT_MINUTES)
#   exit 3 = site down + rolled back RESULT=site-down
# Run it in the foreground from a terminal or cron; it returns in the log.
