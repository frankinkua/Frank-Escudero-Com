# opencode-worker configuration
# -------------------------------
# This file is read (shell-sourceable) by /web/opencode-worker.sh on every
# loop iteration, so edits apply within one cycle - no service restart needed.
# Values are KEY="value" lines; '#' starts a comment.
#
# The worker is an INFINITE LOOP OF FRESH opencode SESSIONS. Every iteration
# spawns a brand-new `opencode run` process (new process = new context), so a
# long-running agent can never poison later runs with a bloated conversation.
# Each run works in /web with the PROMPT below and commits its changes to the
# git repo in /web (one commit per run, so you can always roll back with
# `git log` / `git checkout`).

# Master switch: 1 = run the loop, 0 = stop starting new runs.
# (An in-flight run finishes; use /etc/init.d/opencode-worker stop to kill it.)
ENABLED="1"

# The task handed to every session. Change this to redirect what the agent does.
PROMPT="Improve this app or ecosystem looking for Todo.md files or find a task yourself, do it, reflec on an improvement and leave it in a Todo.md if not already there. This website will be a Reflex python framework CV website, for data of a person that will be added later."

# Minutes between the end of one run and the start of the next.
INTERVAL_MINUTES="60"

# Model id in opencode's provider/model format. gemma4 runs locally through
# ollama, which opencode reaches over its OpenAI-compatible endpoint. The
# worker script registers the model with opencode automatically on every run
# (it must match the name ollama reports: `ollama list`).
MODEL="openai/gemma4:latest"

# Ollama API base URL. Leave as-is for the local install; opencode injects it
# (plus /v1 and the model registration) on every run.
URL="http://127.0.0.1:11434"

# Hard kill for one run, in minutes. 8B model on CPU can be slow; raise it if
# runs keep getting killed mid-work.
TIMEOUT_MINUTES="30"

# 0 = run forever. Set to a number to cap total runs (nice for testing).
MAX_RUNS="0"

# 1 = pass --auto to opencode (auto-approves its actions, headless-friendly).
# The agent can then edit/restart things without a human. Risk is on you.
AUTO_APPROVE="1"

# Local URL used to health-check the site after each run. If the request
# fails, the worker rolls the repo back to the last good commit and restarts
# the website service. Empty = skip verification (not recommended).
VERIFY_URL="http://127.0.0.1:8000"

# 1 = commit each run's changes to git in /web (keeps rollback history).
# 0 = let the agent's edits sit uncommitted.
GIT_COMMIT="1"

# Where the worker's own output is logged (opencode's per-run stdout/stderr
# is appended to the same file).
LOG_FILE="/var/log/opencode-worker.log"
